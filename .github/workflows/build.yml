name: Build & release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release from this run"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.HUSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hush.jks"
            echo "HUSH_KEYSTORE_PATH=$RUNNER_TEMP/hush.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          HUSH_KEYSTORE_PASSWORD: ${{ secrets.HUSH_KEYSTORE_PASSWORD }}
          HUSH_KEY_ALIAS: ${{ secrets.HUSH_KEY_ALIAS }}
          HUSH_KEY_PASSWORD: ${{ secrets.HUSH_KEY_PASSWORD }}
        run: |
          # Empty secrets must not override the bundled key's defaults.
          [ -z "$HUSH_KEYSTORE_PASSWORD" ] && unset HUSH_KEYSTORE_PASSWORD
          [ -z "$HUSH_KEY_ALIAS" ] && unset HUSH_KEY_ALIAS
          [ -z "$HUSH_KEY_PASSWORD" ] && unset HUSH_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Hush-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release (read by Obtainium)
        if: >-
          github.event_name != 'pull_request' && (
            startsWith(github.ref, 'refs/tags/v') ||
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Hush 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
          generate_release_notes: true
